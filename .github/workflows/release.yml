name: Windows Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\NEXUS.sln
      - name: Build
        run: dotnet build .\NEXUS.sln -c Release --no-restore
      - name: Test
        run: dotnet test .\NEXUS.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish Windows x64
        run: dotnet publish .\src\Nexus.App\Nexus.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o .\artifacts\win-x64
      - name: Verify executable
        shell: pwsh
        run: if (-not (Test-Path .\artifacts\win-x64\NEXUS.exe)) { throw 'NEXUS.exe was not produced.' }
      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath .\artifacts\NEXUS-1.0-win-x64-portable.zip -Force
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0-win-x64-portable
          path: .\artifacts\NEXUS-1.0-win-x64-portable.zip
